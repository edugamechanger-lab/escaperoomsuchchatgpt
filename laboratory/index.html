<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escape Room — Лаборатория</title><style>
:root{--ink:#152c40;--cyan:#55e3d1;--orange:#ffb45b;--cream:#fff6e8;--blue:#153e5a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0b263a,#184b64);font:16px system-ui,Arial;color:var(--cream)}.shell{max-width:1180px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top h1{margin:0;font-size:clamp(23px,3.5vw,36px)}.tag{color:#9fe8e4;letter-spacing:.1em;font-size:12px}.score{background:#11354d;padding:13px 18px;border:1px solid #457e8a;border-radius:14px}.hint{color:#c9e4e8;margin:10px 0 18px}.scene{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:7px solid #467a87;border-radius:24px;background:#477f8b;box-shadow:0 20px 45px #061e2b88}.scene svg{display:block;width:100%;height:100%}.spot{position:absolute;border:2px solid transparent;border-radius:18px;background:transparent;cursor:pointer;transition:.15s;touch-action:manipulation}.spot:hover,.spot:focus-visible{outline:none;border-color:#ffdb83;background:#ffe29a30;box-shadow:0 0 0 4px #ffb45b40}.spot.done{border-color:#4ff0a8;background:#4ff0a825}.spot::after{content:attr(data-label);position:absolute;bottom:100%;left:50%;transform:translate(-50%,0);background:#102f45;color:white;font:600 13px system-ui;padding:5px 9px;border-radius:8px;opacity:0;pointer-events:none;white-space:nowrap}.spot:hover::after,.spot:focus-visible::after{opacity:1}.spot[data-id="flask"]{left:17%;top:52%;width:17%;height:26%}.spot[data-id="monitor"]{left:36%;top:21%;width:25%;height:28%}.spot[data-id="cabinet"]{left:66%;top:48%;width:16%;height:31%}.spot[data-id="clock"]{left:8%;top:13%;width:12%;height:22%}.spot[data-id="door"]{left:83%;top:19%;width:14%;height:65%}.bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:15px;color:#d0e8ec;font-size:14px}.reset{border:1px solid #81b5bf;background:#11364e;color:white;border-radius:10px;padding:9px 13px;cursor:pointer}.veil{position:fixed;inset:0;background:#041825bd;display:grid;place-items:center;padding:18px;z-index:10}.veil[hidden]{display:none}.modal{width:min(520px,100%);background:#fff8ec;color:#18354a;border-radius:22px;padding:25px;box-shadow:0 25px 80px #0009}.modal h2{margin:0 0 10px}.modal p{line-height:1.5}.modal label{display:block;font-weight:700;margin:15px 0 6px}.modal input{font:inherit;width:100%;padding:13px;border:2px solid #b9cbd0;border-radius:11px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.primary,.secondary{border:0;border-radius:11px;padding:12px 18px;font:700 15px system-ui;cursor:pointer}.primary{background:#ff9d49;color:#182b38}.secondary{background:#dcebef;color:#23465b}.feedback{min-height:26px;font-weight:700;margin-top:12px}.good{color:#187c4c}.bad{color:#b83f31}.scene.completed{border-color:#4ff0a8}@media(max-width:600px){.shell{padding:10px}.scene{border-width:4px;border-radius:14px}.spot{border-radius:8px}.spot::after{font-size:10px}.top h1{font-size:23px}.modal{padding:18px}}
</style></head><body><main class="shell"><header class="top"><div><div class="tag">ОБРАЗОВАТЕЛЬНЫЙ ESCAPE ROOM · ДЕМО</div><h1>Лаборатория: аварийный протокол</h1></div><div class="score" id="score" aria-live="polite">Системы восстановлены: 0 / 4</div></header><p class="hint">Система заблокировала выход из лаборатории. Исследуй четыре предмета, выполни задания и открой дверь. Нажимай на объекты комнаты.</p><section class="scene" id="scene" aria-label="Интерактивная лаборатория"><svg viewBox="0 0 1000 562.5" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Рисованная лаборатория с часами, колбами, компьютером, шкафом и дверью"><defs><linearGradient id="wall" x2="0" y2="1"><stop stop-color="#438aa1"/><stop offset="1" stop-color="#286075"/></linearGradient><linearGradient id="floor" x2="0" y2="1"><stop stop-color="#e1a67e"/><stop offset="1" stop-color="#a86665"/></linearGradient></defs><rect width="1000" height="562.5" fill="url(#wall)"/><path d="M0 375H1000V562.5H0Z" fill="url(#floor)"/><path d="M0 375L500 490 1000 375" fill="none" stroke="#f7cc99" stroke-width="5"/><path d="M180 375L130 562 M500 490V562 M815 375L900 562" stroke="#f2c098" stroke-width="3" opacity=".5"/><rect x="40" y="40" width="275" height="160" rx="17" fill="#204e67" stroke="#8cdece" stroke-width="8"/><path d="M60 95H295M60 135H295M120 58V185M230 58V185" stroke="#5ba3b7" stroke-width="4"/><circle cx="130" cy="130" r="43" fill="#b8dbe0" stroke="#163f55" stroke-width="9"/><path d="M130 130L130 96M130 130L155 143" stroke="#173b50" stroke-width="7" stroke-linecap="round"/><circle cx="130" cy="130" r="6" fill="#ffaf5b"/><rect x="355" y="83" width="283" height="200" rx="19" fill="#17364f" stroke="#ffb665" stroke-width="11"/><rect x="376" y="105" width="241" height="153" rx="8" fill="#153c55"/><path d="M393 230L429 185 465 207 500 149 534 169 577 125" fill="none" stroke="#5de1c9" stroke-width="9" stroke-linecap="round"/><circle cx="576" cy="125" r="9" fill="#ffbb68"/><path d="M495 283V327M450 327H542" stroke="#15364e" stroke-width="16" stroke-linecap="round"/><rect x="80" y="403" width="290" height="29" rx="9" fill="#18384b"/><path d="M105 401V331H338V401" fill="#f4c290" stroke="#18384b" stroke-width="10"/><path d="M172 341V286H207V341L235 383H145Z" fill="#6be6d2" stroke="#e5f8f1" stroke-width="9"/><path d="M166 358H215" stroke="#1f9a96" stroke-width="8"/><path d="M269 346V305H301V346L325 385H246Z" fill="#f4a56b" stroke="#ffe6b7" stroke-width="8"/><circle cx="281" cy="362" r="8" fill="#ffe6b7"/><rect x="655" y="276" width="168" height="173" rx="13" fill="#efbb84" stroke="#18394d" stroke-width="11"/><path d="M738 286V441M667 365H813" stroke="#805b59" stroke-width="8"/><circle cx="712" cy="327" r="7" fill="#1a4858"/><circle cx="765" cy="327" r="7" fill="#1a4858"/><rect x="832" y="104" width="149" height="362" rx="14" fill="#17384e" stroke="#ffbc67" stroke-width="12"/><rect x="854" y="127" width="105" height="312" rx="7" fill="#286b76"/><rect x="865" y="144" width="83" height="44" rx="8" fill="#0e3e51"/><text x="907" y="172" font-size="20" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#a1e8df">EXIT</text><circle cx="933" cy="292" r="10" fill="#ffbc67"/><path d="M0 374H1000" stroke="#17394d" stroke-width="14"/><circle cx="710" cy="73" r="15" fill="#ffb45b"/><circle cx="751" cy="73" r="15" fill="#6de2cd"/><circle cx="792" cy="73" r="15" fill="#ffb45b"/></svg><button class="spot" data-id="clock" data-label="Часы" aria-label="Исследовать часы"></button><button class="spot" data-id="flask" data-label="Колбы" aria-label="Исследовать колбы"></button><button class="spot" data-id="monitor" data-label="Монитор" aria-label="Исследовать монитор"></button><button class="spot" data-id="cabinet" data-label="Шкаф" aria-label="Исследовать шкаф"></button><button class="spot" data-id="door" data-label="Дверь" aria-label="Открыть дверь"></button></section><div class="bottom"><span>Все элементы комнаты встроены в HTML. Подходит для GitHub Pages.</span><button class="reset" id="reset">Начать заново</button></div></main><div class="veil" id="veil" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="question"></p><label for="answer">Твой ответ</label><input id="answer" autocomplete="off" spellcheck="false" placeholder="Введи ответ"><div class="actions"><button class="primary" id="check">Проверить</button><button class="secondary" id="close">Вернуться в комнату</button></div><p class="feedback" id="feedback" aria-live="polite"></p><button class="secondary" id="tip">Подсказка</button></div></div><script>
// Редактируйте только данные задач. Координаты предметов уже закреплены в CSS.
const tasks={clock:{title:'Часы · Код времени',question:'Сколько минут составляют 3/4 часа? Введи число.',answers:['45'],hint:'В одном часе 60 минут. Умножь 60 на 3/4.',explain:'3/4 от 60 = 45 минут.'},flask:{title:'Колбы · Реактивы',question:'Сколько атомов кислорода в трех молекулах CO₂? Введи число.',answers:['6'],hint:'В каждой молекуле CO₂ два атома кислорода.',explain:'3 × 2 = 6 атомов кислорода.'},monitor:{title:'Монитор · Проверка системы',question:'Реши уравнение: 4x + 8 = 24. Чему равно x?',answers:['4','x=4'],hint:'Сначала вычти 8, затем раздели на 4.',explain:'4x=16, значит x=4.'},cabinet:{title:'Шкаф · Архив формул',question:'Чему равна площадь прямоугольника со сторонами 6 см и 7 см? Введи число.',answers:['42','42см2','42см²'],hint:'Площадь прямоугольника — произведение его сторон.',explain:'6 × 7 = 42 см².'}};
const solved=new Set();let active=null;const $=id=>document.getElementById(id);const normalize=s=>s.toLowerCase().replace(/\s+/g,'').replace(/[.,]/g,'').replace(/²/g,'2');function show(id){active=id;const t=tasks[id];$('dialog-title').textContent=t.title;$('question').textContent=t.question;$('answer').value='';$('feedback').textContent='';$('feedback').className='feedback';$('veil').hidden=false;$('answer').focus()}function close(){$('veil').hidden=true;active=null}function update(){$('score').textContent=`Системы восстановлены: ${solved.size} / 4`;document.querySelectorAll('.spot').forEach(b=>b.classList.toggle('done',solved.has(b.dataset.id)));$('scene').classList.toggle('completed',solved.size===4)}document.querySelectorAll('.spot').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.id;if(id==='door'){if(solved.size===4){$('veil').hidden=false;active=null;$('dialog-title').textContent='Миссия выполнена!';$('question').textContent='Все четыре системы восстановлены. Дверь открыта — ты выбрался из лаборатории!';$('answer').hidden=true;$('check').hidden=true;$('tip').hidden=true;$('feedback').textContent='Поздравляем!';$('feedback').className='feedback good'}else{$('veil').hidden=false;active=null;$('dialog-title').textContent='Дверь пока заблокирована';$('question').textContent=`Восстанови все четыре системы. Осталось: ${4-solved.size}. Выбери любой предмет в комнате.`;$('answer').hidden=true;$('check').hidden=true;$('tip').hidden=true;$('feedback').textContent=''}return}if(solved.has(id)){show(id);$('feedback').textContent='Это задание уже выполнено. '+tasks[id].explain;$('feedback').className='feedback good'}else show(id);$('answer').hidden=false;$('check').hidden=false;$('tip').hidden=false}));$('check').addEventListener('click',()=>{if(!active)return;const t=tasks[active];const correct=t.answers.some(a=>normalize(a)===normalize($('answer').value));$('feedback').textContent=correct?'Верно! Система восстановлена. '+t.explain:'Пока неверно. Попробуй еще раз или открой подсказку.';$('feedback').className='feedback '+(correct?'good':'bad');if(correct){solved.add(active);update()}});$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')$('check').click()});$('tip').addEventListener('click',()=>{if(active){$('feedback').textContent=tasks[active].hint;$('feedback').className='feedback'}});$('close').addEventListener('click',close);$('veil').addEventListener('click',e=>{if(e.target===$('veil'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});$('reset').addEventListener('click',()=>{solved.clear();update();close()});update();
</script></body></html>
